<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tudo vem do próprio servidor (mesma origem): nada de script, estilo ou conexão de fora. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'">
    <title>Lane</title>
    <link rel="icon" type="image/png" href="icone.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div class="janela" id="janela">
      <!-- Barra de título do app (a janela não tem a moldura do Windows): mesma do workflow. -->
      <header class="titulo" id="titlebar">
        <span class="app-marca" aria-label="Lane"><img class="app-marca-icone" src="icone.png" alt="" width="24" height="24"><span class="app-marca-texto">Lane</span></span>
        <!-- Pausar/retomar a captura em andamento (rastreio, coleta, repescagem, visão): sempre à vista quando há uma. Também Ctrl+Alt+P e a bandeja. -->
        <button type="button" class="captura-btn" id="capturaBtn" hidden></button>
        <span class="dir" id="status" role="status"><span class="ponto" id="statusPonto"></span><span id="statusTexto">conectando ao servidor…</span></span>
        <div class="janela-botoes" id="janelaBotoes" hidden>
          <!-- Tela cheia (o app abre maximizado; a tela cheia é opção): sempre visível na barra para sair e voltar (também F11). -->
          <button type="button" class="win-btn" id="winCheia" aria-label="Tela cheia" title="Tela cheia (F11)" aria-pressed="false">&#x26F6;</button>
          <button type="button" class="win-btn" id="winMin" aria-label="Minimizar" title="Minimizar">&#x2014;</button>
          <button type="button" class="win-btn" id="winMax" aria-label="Maximizar" title="Maximizar">&#x25A1;</button>
          <button type="button" class="win-btn win-close" id="winFecha" aria-label="Fechar" title="Fechar">&#x2715;</button>
        </div>
      </header>
      <div class="corpo">
        <nav class="menu" aria-label="Menu">
          <span class="rot">rastrear</span>
          <a href="#jogadores" data-menu="jogadores">Jogadores</a>
          <a href="#rastreio" data-menu="rastreio">Fila de rastreio <span class="selo" id="seloRastreio" hidden></span></a>
          <a href="#partidas" data-menu="partidas">Partidas rastreadas</a>
          <span class="rot">aprender</span>
          <a href="#estudo" data-menu="estudo">Estudo</a>
          <a href="#configuracoes" data-menu="configuracoes">Configurações</a>
        </nav>
        <main class="tela" id="conteudo" tabindex="-1"></main>
      </div>
    </div>
    <div class="cheia" id="cheia" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
